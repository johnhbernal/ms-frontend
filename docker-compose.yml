services:
  ms-frontend:
    build:
      context: .
      args:
        VITE_AUTH_API_URL: ${VITE_AUTH_API_URL:-http://localhost:8081}
        VITE_PRACTICA_API_URL: ${VITE_PRACTICA_API_URL:-http://localhost:8082/api}
    ports:
      - "3000:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
